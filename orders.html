<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My orders - Sri Sivamurugan Crackers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<header class="band"><div class="wrap wide">
  <div class="nav"><a class="shop" href="index.html">&larr; Sri Sivamurugan Crackers</a><button class="navbtn" id="out" type="button">Logout</button></div>
  <h1>My orders</h1>
  <p id="hi"></p>
</div></header>
<main><div class="wrap wide"><div id="list" aria-live="polite"></div></div></main>
<script src="auth.js"></script>
<script>
const $=s=>document.querySelector(s);
const s=getSession();
if(!s){location.replace("login.html?next=orders.html")}
else{
  $("#hi").textContent="Hi, "+s.name+" ("+s.phone+")";
  $("#out").onclick=logout;
  load();
}
async function load(){
  const box=$("#list");
  box.innerHTML='<div class="panel muted">Loading your orders...</div>';
  const r=await api({action:"myOrders",token:s.token});
  if(!r.ok){
    if(r.relogin||/login again/i.test(errMsg(r))){clearSession();location.replace("login.html?next=orders.html");return}
    box.innerHTML='<div class="panel"><p class="err">'+esc(errMsg(r))+'</p><button class="ghost" id="retry" type="button">Try again</button></div>';
    $("#retry").onclick=load;return;
  }
  const list=r.orders||[];
  if(!list.length){
    box.innerHTML='<div class="panel empty"><p>No orders yet.</p><a class="primary" href="index.html">Browse crackers</a></div>';return;
  }
  box.innerHTML=list.map(o=>{
    const items=String(o.items||"").split(/\s*;\s*|\r?\n/).map(t=>t.trim()).filter(Boolean);
    const n=Number(o.total),total=(o.total===""||o.total==null||isNaN(n))?esc(o.total||""):fmt(n);
    return '<article class="ord"><div class="oh"><b class="oid">'+esc(o.orderId)+'</b><span class="pill '+statusClass(o.status)+'">'+esc(o.status||"Pending")+'</span></div>'
      +'<div class="muted">'+esc(fmtDate(o.date))+'</div>'
      +'<ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join("")+'</ul>'
      +'<div class="tot"><span>Total</span><b>'+total+'</b></div></article>';
  }).join("");
}
</script>
</body>
</html>
